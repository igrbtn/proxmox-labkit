# Example lab: domain controller + three S2D nodes.
# Copy this directory, adjust addresses/nodes/sizes, run ./build.sh.
# No secrets here - the password comes from LAB_PW in ../../.env.

# Windows image name inside install.wim. Datacenter is required for S2D,
# CORE keeps RAM and disk small. lib/prepare-media.sh prints the exact names.
WIN_IMAGE="Windows Server 2025 SERVERDATACENTERCORE"

# Domain
DOMAIN="lab.local"
NETBIOS="LAB"

# Network: guests sit on an existing bridge, no VLAN work needed
BRIDGE="vmbr0"
PREFIX="24"
GATEWAY="10.0.0.1"
DNS_FORWARD="10.0.0.1"     # where the DC forwards external queries

# Cluster
CLUSTER_NAME="S2DCL01"
CLUSTER_IP="10.0.0.35"

# vmid:name:node:ip:ram_mb:cores:osdisk_gb:datadisks:storage:role
# datadisks = <count>x<size_gb>, 0x0 = none. The DC also hosts the witness share.
VMS="
200:DC01:pve-01:10.0.0.30:4096:2:48:0x0:local-lvm:dc
201:S2D1:pve-01:10.0.0.31:6144:2:48:3x32:local-lvm:node
202:S2D2:pve-02:10.0.0.32:6144:2:48:3x32:local-lvm:node
203:S2D3:pve-03:10.0.0.33:6144:2:48:3x32:local-lvm:node
"
